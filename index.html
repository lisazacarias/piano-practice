<!DOCTYPE html>
<meta charset="utf-8">
<title>Moved — Piano practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 32rem; margin: 12vh auto; padding: 0 1.5rem;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; }
  a { color: #2C5A9E; }
  .muted { opacity: 0.65; font-size: 0.9rem; }
</style>

<h1>Piano practice has moved</h1>
<p>It now lives at
  <a id="dest" href="https://lisazacarias.github.io/static-apps/apps/piano-practice/">lisazacarias.github.io/static-apps/apps/piano-practice/</a>.
</p>
<p class="muted">
  Your practice history came with it — it's stored per origin, and the new
  address is on the same one. Update your bookmark or re-add it to your home
  screen from the new URL.
</p>

<script>
// This page exists to retire the old address cleanly. Anyone who installed the
// app from here still has a service worker registered against this scope, and
// it would go on answering requests for a version of the app that no longer
// gets updates. The worker was network-first, which is the only reason this
// page is reachable at all: the fetch succeeds, so it serves this instead of
// its cache. Take that opening to clean up, then move along.
//
// Everything below is scoped to THIS directory on purpose. The app moved to
// another Pages site under the same github.io origin, which means it shares
// both the service worker registration list and the Cache Storage namespace
// with this page — and the old and new workers even use the same cache name.
// So `getRegistrations()` and `caches.keys()` both see the new app's things
// too, and clearing them wholesale would knock out the copy we're sending
// people to. Match on scope and on request URL instead.
(async () => {
  const here = new URL('.', location.href).href;
  try {
    const regs = await navigator.serviceWorker?.getRegistrations?.() ?? [];
    await Promise.all(
      regs.filter((r) => r.scope === here).map((r) => r.unregister())
    );

    for (const name of await caches?.keys?.() ?? []) {
      const cache = await caches.open(name);
      const stale = (await cache.keys()).filter((req) => req.url.startsWith(here));
      await Promise.all(stale.map((req) => cache.delete(req)));
    }
  } catch (e) {
    // Nothing worth blocking the redirect over — a stale worker here is
    // network-first anyway, so it can only ever serve this same page.
  }
  location.replace(document.getElementById('dest').href);
})();
</script>
